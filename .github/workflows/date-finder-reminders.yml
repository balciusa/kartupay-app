name: Date Finder reminders

on:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: date-finder-reminders
  cancel-in-progress: false

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMINDER_URL: https://kartupay-app.vercel.app/api/date-selection/reminders
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verify secret configuration
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not configured."
            exit 1
          fi

      - name: Process Date Finder reminders
        shell: bash
        run: |
          # Suppress response bodies; never log credentials or follow redirects.
          status=$(curl \
            --request GET \
            --fail-with-body \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$REMINDER_URL")
          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Reminder endpoint returned HTTP ${status}; expected 2xx."
            exit 1
          fi
          echo "Reminder endpoint returned HTTP ${status}."
