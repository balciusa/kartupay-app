name: PR40 focused unit tests
on:
  pull_request:
    paths:
      - 'src/lib/pr40*.ts'
      - 'src/lib/atomicMembershipServer.ts'
      - 'src/lib/atomicMembershipRpc.ts'
      - 'src/lib/projectActions.test.ts'
      - 'src/app/project/[id]/actions.ts'
      - 'supabase/migrations/20261116205555_atomic_membership_and_managed_approval.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pr40-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pr40-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PR40 focused TypeScript tests
        run: node --test --experimental-transform-types src/lib/pr40*.test.ts src/lib/projectActions.test.ts
      - name: Lint PR40 TypeScript sources and tests
        run: npx eslint src/lib/pr40*.ts src/lib/atomicMembershipServer.ts src/lib/atomicMembershipRpc.ts src/lib/projectActions.test.ts 'src/app/project/[id]/actions.ts'
